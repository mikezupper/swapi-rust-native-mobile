[workspace]
members = ["crates/swapi-core", "crates/swapi-ffi", "crates/uniffi-bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "=2.5.7"
uniffi = "=0.32.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
